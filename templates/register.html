<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body style="font-family: Arial; background:#121212; display:flex; justify-content:center; align-items:center; height:100vh;">

    <div style="background:white; padding:30px; border-radius:10px; width:300px; box-shadow:0 0 15px rgba(0,0,0,0.3); text-align:center;">

        <h2>Register</h2>

        <form method="POST">
            <input type="text" name="name" placeholder="Full Name" required
                   style="width:100%; padding:10px; margin:10px 0;"><br>

            <input type="email" name="email" placeholder="Email" required
                   style="width:100%; padding:10px; margin:10px 0;"><br>

            <input type="password" name="password" placeholder="Password" required
                   style="width:100%; padding:10px; margin:10px 0;"><br>

            <button type="submit"
                    style="width:100%; padding:10px; background:#28a745; color:white; border:none; border-radius:5px;">
                Register
            </button>
        </form>

        <p style="margin-top:15px;">
            Already have an account? <a href="/login">Login</a>
        </p>

    </div>

</body>
</html>
