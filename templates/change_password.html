<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Apex Vista</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f7;
            color: #222;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        .page {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .password-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .password-card h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .password-card p {
            margin: 0 0 30px;
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #111;
        }

        .password-hint {
            margin-top: 6px;
            font-size: 12px;
            color: #888;
        }

        .btn {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #d4af37;
            color: #111;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #111;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 5%;
            }

            .nav-links {
                gap: 12px;
            }

            .password-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">APEX VISTA</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/orders">My Orders</a>
            <a href="/cart">Cart</a>
        </div>
    </nav>

    <main class="page">
        <div class="password-card">

            <h1>Change Password</h1>

            <p>
                Update your password to keep your Apex Vista account secure.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label for="current_password">
                        Current Password
                    </label>

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new_password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        minlength="8"
                        required
                    >

                    <div class="password-hint">
                        Use at least 8 characters.
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Change Password
                </button>

            </form>

            <a href="/" class="back-link">
                ← Back to Apex Vista
            </a>

        </div>
    </main>

</body>
</html>
